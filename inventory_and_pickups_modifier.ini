[bands]

; Multiplier ranges for each type. count-<type> is how many ranges the type is divided into, 1 to 10; at 1, range 1's multiplier applies to every amount. Each size is the largest amount its range covers, and a range covers every amount above the range before it up to its size. The last range in use covers every amount above the range before it, so its own size is not used. Crafting materials are sized in whole items and quarters.
